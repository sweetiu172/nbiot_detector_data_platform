# This is the single source of truth for all Spark jobs
spark.master                             spark://spark-master:7077

# --- JARs and Classpath ---
# NOTE: This must be a comma-separated list of your actual JAR filenames
spark.jars                               /opt/spark/extra-jars/hadoop-aws-3.3.4.jar,/opt/spark/extra-jars/aws-java-sdk-bundle-1.12.262.jar,/opt/spark/extra-jars/delta-spark_2.12-3.2.0.jar,/opt/spark/extra-jars/hive-metastore-2.3.9.jar,/opt/spark/extra-jars/delta-storage-3.2.0.jar,/opt/spark/extra-jars/postgresql-42.5.4.jar
spark.driver.extraClassPath              /opt/spark/extra-jars/*
spark.executor.extraClassPath            /opt/spark/extra-jars/*

# --- Warehouse and Metastore ---
spark.sql.warehouse.dir                  s3a://warehouse/spark-warehouse
spark.sql.catalogImplementation          hive
spark.sql.session.timeZone               UTC

# --- Delta Lake Settings ---
spark.sql.extensions                     io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog          org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.hadoop.fs.s3a.secret.key           minio_secret_key  
spark.hadoop.fs.s3a.access.key           minio_access_key