  spark-master:
    # image: jupyter/pyspark-notebook:spark-3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark_master
    user: root
    ports:
      - "8888:8888" # Jupyter Lab UI
      - "8080:8080"
      - "4040:4040" # Spark UI
      - "7077:7077"
    volumes:
      - ./spark-code:/home/jovyan/work
      - ./scripts:/home/jovyan/scripts
      - ./jars:/opt/spark/extra-jars
      - ./config:/usr/local/spark/conf
    command: >
      bash -c "
      /usr/local/spark-3.5.0-bin-hadoop3/sbin/start-master.sh && 
      /usr/local/bin/start-notebook.sh
      "
    environment:
      - SPARK_MASTER_HOST=spark-master
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  spark-worker:
    # image: jupyter/pyspark-notebook:spark-3.5.0
    build:
      context: .
      dockerfile: Dockerfile.spark
    # container_name: spark_worker
    user: root
    depends_on:
      - spark-master
    command: >
       /usr/local/spark-3.5.0-bin-hadoop3/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ./jars:/opt/spark/extra-jars

  feature_store:
    container_name: feature_store
    build:
      context: ./feature_repo
      dockerfile: Dockerfile
    environment:
      - SPARK_CONF_DIR=/app/conf
      - AWS_ACCESS_KEY_ID=minio_access_key
      - AWS_SECRET_ACCESS_KEY=minio_secret_key
    volumes:
      - ./config:/app/conf
      - ./jars:/app/jars
    depends_on:
      - metastore_db

  mlflow:
    image: python:3.9-slim
    container_name: mlflow_server
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minio_access_key
      - AWS_SECRET_ACCESS_KEY=minio_secret_key
    command: >
      bash -c "pip install mlflow boto3 psycopg2-binary &&
               mlflow server --host 0.0.0.0
               --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres/mlflow_db
               --default-artifact-root s3://mlflow/"
    depends_on:
      - postgres
      - minio


volumes:
  postgres-db-volume:
  offline-db-volume:
  minio_storage: